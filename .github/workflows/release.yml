name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      publish:
        description: 'Publish to pub.dev?'
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5'

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos analyze

      - name: Test
        run: melos test

      - name: Release
        run: |
          cd tool && dart pub get && cd ..
          dart run tool/release.dart --${{ inputs.version_bump }} ${{ inputs.publish == 'true' && '--publish' || '' }}

      - name: Push tags
        run: git push --follow-tags
