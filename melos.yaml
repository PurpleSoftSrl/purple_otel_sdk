name: openapi-flutter

packages:
  - ../*
  - ../../stratum
  - ../../litert
  - ../../stt
  - ../../tts
  - ../../tts_kokoro
  - ../../../packages/other/*

ide:
  intellij:
    enabled: false

scripts:
  analyze:
    run: dart analyze .
    description: Run static analysis on all packages.
    exec:
      concurrency: 6

  test:
    run: dart test .
    description: Run all tests.
    exec:
      concurrency: 6
      failFast: true

  format:
    run: dart format --set-exit-if-changed .
    description: Check formatting on all packages.

  bootstrap:
    run: dart pub get
    description: Bootstrap all packages.

  clean:
    run: dart clean
    description: Clean all packages.

  changelog:
    run: dart run tool/changelog.dart
    description: Generate CHANGELOG.md from conventional commits since last tag.

  release:
    run: dart run tool/release.dart
    description: Full release pipeline — bump, changelog, commit, tag, and optionally publish.
    exec:
      failFast: true

command:
  version:
    workspaceChangelog: false
    linkToCommit: true
    branch: master
    message: 'chore(release): publish %v'
    releaseUrl: true
